<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GadgetStore System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Utama -->
  <header>
    <h1>GadgetStore System</h1>
    <nav id="mainNav">
      <button class="nav-btn active" id="btnNavLogin" onclick="switchPage('loginPage')">Halaman Login</button>
      <button class="nav-btn" id="btnNavCustomer" onclick="switchPage('customerPage')">Katalog Pembeli</button>
      <button class="nav-btn logout-btn" id="btnNavLogout" onclick="handleLogout()" style="display: none;">Logout Admin</button>
    </nav>
  </header>

  <div class="container">

    <!-- 1. HALAMAN LOGIN -->
    <div id="loginPage" class="page active">
      <div class="section-card login-card">
        <h2 class="section-title text-center">Login Akses Sistem</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">Username / Email</label>
            <input type="text" id="username" placeholder="Masukkan username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
          </div>
          <div class="form-group">
            <label for="role">Masuk Sebagai</label>
            <select id="role">
              <option value="customer">Pembeli (Customer)</option>
              <option value="admin">Administrator (Admin)</option>
            </select>
          </div>
          <button type="submit" class="btn-submit">Masuk ke System</button>
        </form>
      </div>
    </div>

    <!-- 2. HALAMAN PANEL ADMIN -->
    <div id="adminPage" class="page">
      <!-- Form Tambah / Edit Produk -->
      <div class="section-card">
        <h2 class="section-title" id="formTitle">Panel Administrator - Tambah Produk Baru</h2>
        <form id="productForm" onsubmit="saveProduct(event)">
          <input type="hidden" id="editIndex" value="-1">

          <div class="form-group">
            <label for="prodName">Nama Produk</label>
            <input type="text" id="prodName" placeholder="Contoh: Smartphone Premium X" required>
          </div>

          <div class="form-group">
            <label for="prodPrice">Harga Produk (Rp)</label>
            <input type="number" id="prodPrice" placeholder="Contoh: 12000000" required>
          </div>

          <div class="form-group">
            <label for="prodDesc">Deskripsi & Spesifikasi Produk</label>
            <textarea id="prodDesc" rows="4" placeholder="Contoh: Layar 120Hz AMOLED, RAM 12GB, Storage 256GB" required></textarea>
          </div>

          <!-- Input File Gambar -->
          <div class="form-group">
            <label for="prodImage">Gambar Produk (Pilih dari Galeri HP)</label>
            <input type="file" id="prodImage" accept="image/*" onchange="previewImage(event)">
            <small id="imgNote" class="text-muted"></small>
            <img id="imagePreview" class="media-preview" alt="Preview Gambar">
          </div>

          <!-- Input File Video -->
          <div class="form-group">
            <label for="prodVideo">Video Demo Produk (Pilih dari Galeri HP)</label>
            <input type="file" id="prodVideo" accept="video/*" onchange="previewVideo(event)">
            <small id="vidNote" class="text-muted"></small>
            <video id="videoPreview" class="media-preview" controls></video>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmitForm">Simpan Produk ke Database</button>
          <button type="button" class="btn-cancel" id="btnCancelEdit" onclick="cancelEdit()">Batal Edit</button>
        </form>
      </div>

      <!-- Tabel Kelola Produk -->
      <div class="section-card">
        <h2 class="section-title">Daftar Inventaris & Kelola Produk</h2>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Gambar</th>
                <th>Nama Produk</th>
                <th>Harga</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="adminProductTable">
              <!-- Data produk diisi lewat JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 3. HALAMAN PANEL PEMBELI (Katalog Ringkas) -->
    <div id="customerPage" class="page">
      <div class="section-card">
        <h2 class="section-title">Katalog Produk</h2>

        <!-- Grid Katalog Ringkas -->
        <div id="catalogGrid" class="catalog-grid"></div>

        <!-- Tracking Status Pesanan -->
        <div id="orderStatusContainer" class="order-status-container">
          <h3>Status Pesanan Terakhir</h3>
          <div id="orderStatusBox" class="order-status-box"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL / POPUP DETAIL PRODUK -->
  <div id="productModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img id="modalImg" class="modal-img" src="" alt="Detail Gambar">
      <div class="modal-body">
        <h2 id="modalTitle">Nama Produk</h2>
        <div id="modalPrice" class="modal-price">Rp 0</div>
        <p id="modalDesc" class="modal-desc">Deskripsi produk...</p>

        <div class="modal-video-box">
          <h4>Video Demo Produk:</h4>
          <video id="modalVideo" class="product-video" controls>
            <source id="modalVideoSrc" src="">
            Browser Anda tidak mendukung video tag.
          </video>
        </div>

        <button id="modalBuyBtn" class="btn-buy-modal">Beli Sekarang</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
